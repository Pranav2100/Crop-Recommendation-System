<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Crop Prediction 🌱</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: url("https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1920&q=80") no-repeat center center/cover;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(3px);
    }

    .container {
      position: relative;
      z-index: 2;
      background: rgba(255, 255, 255, 0.95);
      padding: 35px 40px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      width: 380px;
      text-align: center;
      animation: fadeIn 1s ease-in-out;
    }

    .container h1 {
      font-size: 28px;
      margin-bottom: 10px;
      color: #2c3e50;
      animation: slideDown 1s ease forwards;
    }

    .container p {
      color: #555;
      margin-bottom: 20px;
      animation: fadeIn 1.5s ease;
    }

    form input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 15px;
      outline: none;
      transition: all 0.3s ease;
    }

    form input:focus {
      border-color: #00c853;
      box-shadow: 0px 0px 10px rgba(0, 200, 83, 0.5);
      transform: scale(1.02);
    }

    form button {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #43cea2, #185a9d);
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      animation: pulse 2s infinite;
    }

    form button:hover {
      transform: scale(1.05);
      box-shadow: 0 5px 15px rgba(24, 90, 157, 0.4);
    }

    .result {
      margin-top: 20px;
      padding: 12px;
      border-radius: 10px;
      background: #e8f5e9;
      color: #1b5e20;
      font-weight: bold;
      font-size: 16px;
      border: 1px solid #c8e6c9;
      animation: popUp 0.8s ease forwards;
    }

    /* Loading spinner */
    .loader {
      border: 5px solid #f3f3f3;
      border-top: 5px solid #185a9d;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      margin: 15px auto;
      animation: spin 1s linear infinite;
      display: none;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-50px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(24,90,157, 0.6); }
      70% { box-shadow: 0 0 0 15px rgba(24,90,157, 0); }
      100% { box-shadow: 0 0 0 0 rgba(24,90,157, 0); }
    }

    @keyframes popUp {
      from { opacity: 0; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
  <script>
    function showLoader() {
      document.getElementById("loader").style.display = "block";
    }
  </script>
</head>

<body>
  <div class="container">
    <h1>🌱 Crop Prediction</h1>
    <p>Enter soil & climate details to predict the best crop.</p>

    <form action="{{ url_for('predict')}}" method="post" onsubmit="showLoader()">
      <input type="text" name="N" placeholder="Nitrogen (N)" required />
      <input type="text" name="P" placeholder="Phosphorus (P)" required />
      <input type="text" name="K" placeholder="Potassium (K)" required />
      <input type="text" name="temperature" placeholder="Temperature (°C)" required />
      <input type="text" name="humidity" placeholder="Humidity (%)" required />
      <input type="text" name="ph" placeholder="Soil pH" required />
      <input type="text" name="rainfall" placeholder="Rainfall (mm)" required />

      <button type="submit">Predict 🌾</button>
    </form>

    <div id="loader" class="loader"></div>

    {% if prediction_text %}
    <div class="result">
      <h2>{{ prediction_text }}</h2>
    </div>
    {% endif %}
  </div>
</body>
</html>
